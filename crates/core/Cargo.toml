[package]
name = "estivi-core"
description = "Motor de Estivi: codificador SSTV, grilla, gráfica, PTT, audio y escucha CW/DTMF"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
log.workspace = true
serde.workspace = true
toml.workspace = true
chrono.workspace = true
crossbeam-channel.workspace = true
image.workspace = true
ab_glyph = "0.2"
cpal = "0.18"
serialport = { version = "4", default-features = false }
ureq = "3"
serde_json = "1"
semver = "1"
sha2 = "0.10"
flate2 = "1"
tar = { version = "0.4", default-features = false }
qrcode = "0.14"
flacenc = { version = "0.5", default-features = false, features = ["log"] }

[dev-dependencies]
chrono-tz = "0.10"
